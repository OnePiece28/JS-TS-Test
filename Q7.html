<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registration Form</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
		label { display: block; margin: 14px 0 5px; }
		input { box-sizing: border-box; width: 100%; padding: 9px; }
		button { margin-top: 18px; padding: 9px 16px; }
		#message { margin-top: 14px; }
		.error { color: #b00020; }
		.success { color: #176b2c; }
	</style>
</head>
<body>
	<h1>Registration</h1>
	<form id="registrationForm" novalidate>
		<label for="name">Name</label>
		<input id="name" name="name" type="text" autocomplete="name" required>

		<label for="email">Email</label>
		<input id="email" name="email" type="email" autocomplete="email" required>

		<label for="password">Password</label>
		<input id="password" name="password" type="password" autocomplete="new-password" required>

		<button type="submit">Submit</button>
		<p id="message" role="status" aria-live="polite"></p>
	</form>

	<script>
		const form = document.getElementById('registrationForm');
		const message = document.getElementById('message');

		form.addEventListener('submit', (event) => {
			event.preventDefault();

			const name = form.elements.name.value.trim();
			const email = form.elements.email.value.trim();
			const password = form.elements.password.value;
			const errors = [];

			if (!/^[A-Za-z]+$/.test(name)) {
				errors.push('Name must contain alphabetic characters only.');
			}
			if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
				errors.push('Enter a valid email address.');
			}
			if (password.length < 8 || !/[A-Z]/.test(password) ||
					!/[a-z]/.test(password) || !/[0-9]/.test(password)) {
				errors.push('Password must be at least 8 characters and include an uppercase letter, a lowercase letter, and a digit.');
			}

			if (errors.length > 0) {
				message.textContent = errors.join(' ');
				message.className = 'error';
				return;
			}

			try {
				localStorage.setItem('name', name);
				localStorage.setItem('email', email);
				message.textContent = 'Form validated. Name and email saved.';
				message.className = 'success';
				form.reset();
			} catch (error) {
				message.textContent = 'Could not save your details in local storage.';
				message.className = 'error';
			}
		});
	</script>
</body>
</html>
